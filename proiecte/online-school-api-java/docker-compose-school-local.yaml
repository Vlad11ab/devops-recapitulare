services:
  online-school-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "4001:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  online-school-service:
    image: vlad11ab/online-school:1.0
    environment:
      DB_URL: jdbc:mysql://online-school-mysql:4001/online_shop_cloud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "9001:8081"
    depends_on:
      online-school-mysql:
        condition: service_healthy
    restart: unless-stopped
    
volumes:
  mysql_data: